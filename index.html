<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>百人一首読み上げ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        /* 画面中央配置 ＆ 画面領域の8割にサイズを設定 */
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            z-index: 1000;
            background-color: #ffffff;
            padding: 24px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 80vw;  /* 画面幅の80% */
            height: 80vh; /* 画面高の80% */
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* 上部：カウンター ＋ ステータス */
        .top-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .counter-box {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .counter-num {
            font-size: 40px;
            color: #e53935;
        }

        .status-text {
            font-size: 18px;
            color: #666;
            font-weight: bold;
        }

        /* 中部：設定エリア（左右2列で領域に合わせて広がる） */
        .panels-row {
            display: flex;
            gap: 20px;
            width: 100%;
            flex: 1; /* 縦スペースを余さず広げる */
        }

        .saveload-box,
        .settings-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 10px;
            padding: 16px 20px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .saveload-box {
            background-color: #eef2f5;
        }

        .settings-box {
            background-color: #f5f5f5;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .saveload-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .saveload-input {
            flex: 1;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .saveload-btn {
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            white-space: nowrap;
        }

        .saveload-btn.secondary {
            background-color: #6c757d;
        }

        .setting-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }

        .setting-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        .setting-label-val {
            display: flex;
            justify-content: space-between;
        }

        .setting-item input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* モード選択ボタン群 */
        .mode-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 10px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #ccc;
            background-color: #f9f9f9;
            border-radius: 8px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            font-weight: bold;
            color: #fff;
            border-color: #333;
        }

        .mode-btn[data-mode="0"].active { background-color: #555; }
        .mode-btn[data-mode="1"].active { background-color: #2196F3; } /* 青 */
        .mode-btn[data-mode="2"].active { background-color: #E91E63; } /* 桃 */
        .mode-btn[data-mode="3"].active { background-color: #FFC107; color: #000; } /* 黄 */
        .mode-btn[data-mode="4"].active { background-color: #4CAF50; } /* 緑 */
        .mode-btn[data-mode="5"].active { background-color: #FF9800; } /* 橙 */

        /* 操作ボタン */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        #startButton,
        #stopButton {
            flex: 1;
            padding: 14px 20px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: opacity 0.2s ease;
        }

        #startButton {
            background-color: #4CAF50;
            color: white;
        }

        #stopButton {
            background-color: #f44336;
            color: white;
        }

        #startButton:disabled,
        #stopButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 上部：残り枚数 ＆ ステータス -->
        <div class="top-info">
            <div class="counter-box">
                残り: <span id="remainingCount" class="counter-num">100</span> 枚
            </div>
            <div id="statusText" class="status-text">待機中</div>
        </div>

        <!-- 中部：セーブコードと設定を左右2列配置 -->
        <div class="panels-row">
            <!-- セーブコード機能 -->
            <div class="saveload-box">
                <div class="panel-title">🔑 セーブコード</div>
                <div class="saveload-row">
                    <button id="generateCodeBtn" class="saveload-btn">発行</button>
                    <input type="text" id="generatedCodeInput" class="saveload-input" readonly placeholder="コード発行">
                    <button id="copyCodeBtn" class="saveload-btn secondary">コピー</button>
                </div>
                <div class="saveload-row">
                    <input type="text" id="loadCodeInput" class="saveload-input" placeholder="コードを貼り付け">
                    <button id="loadCodeBtn" class="saveload-btn">ロード</button>
                </div>
                <div class="panel-title">クラウド保存（7日間）</div>
                <div class="saveload-row">
                    <button id="cloudSaveBtn" class="saveload-btn">クラウドに保存</button>
                    <input type="text" id="cloudIdInput" class="saveload-input" placeholder="保存ID" autocomplete="off">
                </div>
                <div class="saveload-row">
                    <button id="cloudLoadBtn" class="saveload-btn">IDから読み込み</button>
                    <button id="cloudCopyBtn" class="saveload-btn secondary">IDをコピー</button>
                </div>
            </div>

            <!-- 大会設定 -->
            <div class="settings-box">
                <label class="setting-checkbox">
                    <input type="checkbox" id="playJokaCheckbox" checked>
                    「序歌」を再生する
                </label>
                <div class="setting-item">
                    <div class="setting-label-val">
                        <span>上句→下句の間合い</span>
                        <span id="intervalKamiShimoVal">1.5 秒</span>
                    </div>
                    <input type="range" id="intervalKamiShimo" min="0.5" max="5.0" step="0.5" value="1.5">
                </div>
                <div class="setting-item">
                    <div class="setting-label-val">
                        <span>次の歌への間合い</span>
                        <span id="intervalNextVal">4.0 秒</span>
                    </div>
                    <input type="range" id="intervalNext" min="1.0" max="10.0" step="0.5" value="4.0">
                </div>
            </div>
        </div>

        <!-- 読み上げ範囲選択ボタン群 -->
        <div class="mode-group">
            <button class="mode-btn active" data-mode="0">全体(100首)</button>
            <button class="mode-btn" data-mode="1">青色</button>
            <button class="mode-btn" data-mode="2">桃色</button>
            <button class="mode-btn" data-mode="3">黄色</button>
            <button class="mode-btn" data-mode="4">緑色</button>
            <button class="mode-btn" data-mode="5">橙色</button>
        </div>

        <!-- 操作ボタン群 -->
        <div class="controls">
            <button id="startButton">読み上げ開始</button>
            <button id="stopButton" disabled>停止</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
