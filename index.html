<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百人一首読み上げ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }

        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            background-color: #fff;
            padding: 24px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 80vw;
            height: 80vh;
            overflow-y: auto;
        }

        .top-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .counter-box {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .counter-num {
            font-size: 40px;
            color: #e53935;
        }

        .status-text {
            font-size: 18px;
            color: #666;
            font-weight: bold;
            text-align: right;
        }

        .panels-row {
            display: flex;
            gap: 20px;
            width: 100%;
            flex: 1;
        }

        .saveload-box,
        .settings-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 10px;
            padding: 16px 20px;
            border-radius: 10px;
        }

        .saveload-box {
            background-color: #eef2f5;
        }

        .settings-box {
            background-color: #f5f5f5;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .saveload-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .saveload-input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .saveload-btn {
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            white-space: nowrap;
        }

        .saveload-btn.secondary {
            background-color: #6c757d;
        }

        .setting-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }

        .setting-checkbox input {
            width: 18px;
            height: 18px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        .setting-label-val {
            display: flex;
            justify-content: space-between;
        }

        .setting-item input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .mode-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 10px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #ccc;
            background-color: #f9f9f9;
            border-radius: 8px;
            text-align: center;
        }

        .mode-btn.active {
            font-weight: bold;
            color: #fff;
            border-color: #333;
        }

        .mode-btn[data-mode="0"].active { background-color: #555; }
        .mode-btn[data-mode="1"].active { background-color: #2196F3; }
        .mode-btn[data-mode="2"].active { background-color: #E91E63; }
        .mode-btn[data-mode="3"].active {
            background-color: #FFC107;
            color: #000;
        }
        .mode-btn[data-mode="4"].active { background-color: #4CAF50; }
        .mode-btn[data-mode="5"].active { background-color: #FF9800; }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .controls button {
            flex: 1;
            padding: 14px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        #startButton {
            background-color: #4CAF50;
            color: white;
        }

        #pauseButton {
            background-color: #FF9800;
            color: white;
        }

        #stopButton {
            background-color: #f44336;
            color: white;
        }

        .controls button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        @media (max-width: 700px) {
            .container {
                width: 96vw;
                height: 94vh;
                padding: 16px;
            }

            .panels-row {
                flex-direction: column;
            }

            .mode-group {
                flex-wrap: wrap;
            }

            .mode-btn {
                min-width: 28%;
            }

            .counter-box {
                font-size: 18px;
            }

            .counter-num {
                font-size: 32px;
            }

            .status-text {
                font-size: 14px;
            }

            .controls button {
                padding: 12px 6px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="top-info">
            <div class="counter-box">
                残り:
                <span id="remainingCount" class="counter-num">100</span>
                枚
            </div>
            <div id="statusText" class="status-text">待機中</div>
        </div>

        <div class="panels-row">

            <div class="saveload-box">
                <div class="panel-title">クラウド保存</div>

                <div class="saveload-row">
                    <button id="saveButton" class="saveload-btn">
                        保存
                    </button>
                    <input
                        type="text"
                        id="savedIdInput"
                        class="saveload-input"
                        readonly
                        placeholder="保存ID"
                    >
                    <button id="copyIdButton" class="saveload-btn secondary">
                        コピー
                    </button>
                </div>

                <div class="saveload-row">
                    <input
                        type="text"
                        id="loadIdInput"
                        class="saveload-input"
                        placeholder="保存IDを入力"
                    >
                    <button id="loadButton" class="saveload-btn">
                        読み込み
                    </button>
                </div>

                <div class="saveload-row">
                    <label for="loadRemainingInput" style="font-size:13px;white-space:nowrap;align-self:center;">
                        読み込み後の残り枚数
                    </label>
                    <input
                        type="number"
                        id="loadRemainingInput"
                        class="saveload-input"
                        min="1"
                        step="1"
                        placeholder="空欄なら保存位置"
                    >
                </div>

                <div style="font-size:12px;color:#666;">
                    保存データの有効期限は7日間です。
                </div>
            </div>

            <div class="settings-box">
                <label class="setting-checkbox">
                    <input type="checkbox" id="playJokaCheckbox" checked>
                    「序歌」を再生する
                </label>

                <div class="setting-item">
                    <div class="setting-label-val">
                        <span>次の歌への間合い</span>
                        <span id="intervalNextVal">4.0 秒</span>
                    </div>
                    <input
                        type="range"
                        id="intervalNext"
                        min="1.0"
                        max="10.0"
                        step="0.5"
                        value="4.0"
                    >
                </div>

                <div class="setting-item">
                    <div class="setting-label-val">
                        <span>読み上げ速度</span>
                        <span id="playbackSpeedVal">1.0 倍</span>
                    </div>
                    <input
                        type="range"
                        id="playbackSpeed"
                        min="1.0"
                        max="2.0"
                        step="0.1"
                        value="1.0"
                    >
                </div>
            </div>

        </div>

        <div class="mode-group">
            <button class="mode-btn active" data-mode="0">全体(100首)</button>
            <button class="mode-btn" data-mode="1">青色</button>
            <button class="mode-btn" data-mode="2">桃色</button>
            <button class="mode-btn" data-mode="3">黄色</button>
            <button class="mode-btn" data-mode="4">緑色</button>
            <button class="mode-btn" data-mode="5">橙色</button>
        </div>

        <div class="controls">
            <button id="startButton">読み上げ開始</button>
            <button id="pauseButton" disabled>一時停止</button>
            <button id="stopButton" disabled>停止</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
